[platno-demo]
user = platno-demo
group = platno-demo
listen = /run/php/platno-demo.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 300
request_terminate_timeout = 45s
catch_workers_output = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
php_admin_value[max_execution_time] = 30
php_admin_value[upload_tmp_dir] = /var/www/platno-demo/shared/tmp
php_admin_value[open_basedir] = /var/www/platno-demo:/usr/share/php:/tmp
php_admin_flag[display_errors] = off
