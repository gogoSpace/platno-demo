<VirtualHost *:80>
    ServerName platno.gogospace.cz
    DocumentRoot /var/www/platno-demo/current/public
    Alias /.well-known/acme-challenge/ /var/www/platno-demo/shared/acme/.well-known/acme-challenge/
    <Directory /var/www/platno-demo/shared/acme/.well-known/acme-challenge>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://platno.gogospace.cz%{REQUEST_URI} [R=308,END,NE]
    ErrorLog ${APACHE_LOG_DIR}/platno-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/platno-demo-access.log "%a %t %m %U %H %>s %b"
</VirtualHost>
