<VirtualHost *:443>
    ServerName platno.gogospace.cz
    DocumentRoot /var/www/platno-demo/current/public
    DirectoryIndex index.php
    LimitRequestBody 6291456
    <Directory /var/www/platno-demo/current/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks -MultiViews
        Require all granted
        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [END]
    </Directory>
    <FilesMatch "^(?!index\.php$).+\.ph(?:ar|p|tml)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/platno-demo.sock|fcgi://localhost"
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/platno.gogospace.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/platno.gogospace.cz/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ErrorLog ${APACHE_LOG_DIR}/platno-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/platno-demo-access.log "%a %t %m %U %H %>s %b"
</VirtualHost>
