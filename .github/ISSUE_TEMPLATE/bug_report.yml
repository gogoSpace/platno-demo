name: Bug report
description: Report a reproducible problem with the demo application.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the [private security report](https://github.com/gogoSpace/platno-demo/security/advisories/new).
        Never include ownership cookies, private data, or credentials.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the template and integration mode, with the shortest useful steps.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Demo commit, package commit, PHP version, browser, and local or hosted use.
    validations:
      required: true
