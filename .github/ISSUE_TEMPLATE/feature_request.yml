name: Feature request
description: Suggest an improvement to the demonstration or integration examples.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the concrete use case and where the current demo falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Include alternatives if useful. Package editor features belong in laravel-platno.
    validations:
      required: true
