name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP 8.4 and browser modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platno-demo
        shell: bash
    steps:
      - name: Check out the demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: platno-demo
          persist-credentials: false

      - name: Check out the sibling package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gogoSpace/laravel-platno
          ref: main
          path: platno
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd, dom, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the local environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check PHP and workspace boundaries
        run: composer check

      - name: Set up Node for syntax checks only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check browser module syntax
        run: |
          for source in public/scripts/*.js public/adapters/*.js; do
            node --input-type=module --check < "$source"
          done
